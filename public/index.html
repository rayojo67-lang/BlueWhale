<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Other Projects — Blue Whale Official</title>

  <link rel="icon" href="favicon.ico">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background: #f7fbff;
      color: #123;

      font-family: "Comic Sans MS", "Comic Sans", cursive;

      padding-left: 250px;
    }

    /* SIDEBAR */
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;

      width: 250px;

      background: #0877e8;
      border-right: 5px solid #075bc9;

      padding: 28px 18px;

      z-index: 1000;

      transition: transform 0.3s ease;
    }

    .sidebar.closed {
      transform: translateX(-100%);
    }

    .sidebar-title {
      color: white;

      font-size: 22px;
      font-weight: bold;

      margin: 5px 12px 28px;
    }

    .sidebar a {
      display: block;

      color: white;
      text-decoration: none;

      font-weight: bold;

      padding: 13px 14px;

      border-radius: 10px;

      margin: 6px 0;

      transition: 0.2s;
    }

    .sidebar a:hover,
    .sidebar a.active {
      background: white;
      color: #0877e8;

      transform: rotate(-1deg) translateX(3px);
    }

    .close-sidebar {
      position: absolute;

      right: 14px;
      top: 14px;

      width: 36px;
      height: 36px;

      border: 0;
      border-radius: 9px;

      background: rgba(255, 255, 255, 0.2);

      color: white;

      font-size: 26px;

      font-family: "Comic Sans MS", cursive;

      cursor: pointer;
    }

    .close-sidebar:hover {
      background: white;
      color: #0877e8;
    }

    /* HEADER */
    header {
      height: 76px;

      background: white;

      border-bottom: 1px solid #dcecff;

      display: flex;
      align-items: center;

      padding: 0 40px;
    }

    .brand {
      display: flex;
      align-items: center;

      gap: 12px;

      color: #1268d9;

      font-size: 21px;
      font-weight: bold;
    }

    .brand img {
      width: 46px;
      height: 46px;

      object-fit: contain;
    }

    /* MAIN */
    main {
      width: min(1100px, 90%);

      margin: auto;

      padding: 65px 0;
    }

    h1 {
      color: #075bc9;

      font-size: 48px;

      margin: 0 0 12px;

      animation: appear 0.6s ease;
    }

    .subtitle {
      color: #637a94;

      font-size: 18px;

      margin-bottom: 35px;
    }

    /* PROJECT GRID */
    .projects {
      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(280px, 1fr));

      gap: 25px;
    }

    /* PROJECT CARD */
    .project-card {
      background: white;

      border: 4px solid #0877e8;

      border-radius:
        8px 13px 7px 12px;

      padding: 28px;

      box-shadow:
        6px 6px 0 #0877e8,
        -3px 2px 0 #75b9ff;

      transform: rotate(-0.7deg);

      animation:
        cardAppear 0.7s ease both,
        projectFloat 4s ease-in-out infinite;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .project-card:hover {
      transform:
        rotate(1deg)
        translateY(-7px);

      box-shadow:
        9px 9px 0 #0877e8,
        -3px 3px 0 #75b9ff;
    }

    .project-card h2 {
      color: #075bc9;

      margin-top: 0;

      font-size: 29px;
    }

    .project-card p {
      color: #637a94;

      line-height: 1.7;

      font-size: 16px;
    }

    /* LANGUAGE */
    .language {
      display: inline-flex;

      align-items: center;

      gap: 8px;

      margin: 12px 0 20px;

      padding: 7px 11px;

      border-radius: 20px;

      background: #fff8d6;

      border: 2px solid #f0c900;

      color: #806900;

      font-size: 14px;

      font-weight: bold;
    }

    /* JAVASCRIPT CIRCLE */
    .javascript-dot {
      width: 14px;
      height: 14px;

      border-radius: 50%;

      background: #f7df1e;

      border: 2px solid #d5b900;

      display: inline-block;

      flex-shrink: 0;
    }

    /* GITHUB BUTTON */
    .github-link {
      display: inline-block;

      padding: 12px 18px;

      background: #0877e8;

      color: white;

      text-decoration: none;

      border-radius: 9px;

      font-weight: bold;

      border: 3px solid #075bc9;

      box-shadow: 3px 3px 0 #075bc9;

      transition: 0.2s;
    }

    .github-link:hover {
      background: white;

      color: #0877e8;

      transform:
        rotate(-1deg)
        translateY(-2px);

      box-shadow:
        5px 5px 0 #075bc9;
    }

    /* FOOTER */
    footer {
      text-align: center;

      padding: 22px;

      color: #8aa0b8;

      background: white;

      border-top: 1px solid #dcecff;
    }

    /* ANIMATIONS */
    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform:
          translateY(25px)
          rotate(-4deg);
      }

      to {
        opacity: 1;
        transform:
          translateY(0)
          rotate(-0.7deg);
      }
    }

    @keyframes projectFloat {
      0%, 100% {
        transform:
          rotate(-0.7deg)
          translateY(0);
      }

      50% {
        transform:
          rotate(0.7deg)
          translateY(-4px);
      }
    }

    /* MOBILE */
    @media (max-width: 800px) {

      body {
        padding-left: 0;
      }

      header {
        padding-left: 24px;
      }

      main {
        width: 92%;
      }

      h1 {
        font-size: 40px;
      }

      .projects {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <button
      class="close-sidebar"
      onclick="closeSidebar()"
      aria-label="Close sidebar"
    >
      ×
    </button>

    <div class="sidebar-title">
      Blue Whale
    </div>

    <a href="index.html">
      Include
    </a>

    <a
      href="other-projects.html"
      class="active"
    >
      Other Projects
    </a>

    <a
      href="https://www.youtube.com/@DUUUINGDUCK"
      target="_blank"
      rel="noopener"
    >
      YT Channel
    </a>

  </aside>


  <!-- HEADER -->
  <header>

    <div class="brand">

      <img
        src="blue-whale-logo.png"
        alt="Blue Whale Logo"
      >

      <span>
        Blue Whale Official
      </span>

    </div>

  </header>


  <!-- MAIN -->
  <main>

    <h1>
      Other Projects
    </h1>

    <p class="subtitle">
      Projects and experiments from Blue Whale Official.
    </p>


    <section class="projects">

      <!-- WASM-PORT -->
      <article class="project-card">

        <h2>
          wasm-port
        </h2>

        <div class="language">
          <span class="javascript-dot"></span>
          JavaScript
        </div>

        <p>
          A JavaScript project for wasm-port.
        </p>

        <a
          class="github-link"
          href="https://github.com/rayojo67-lang/wasm-port"
          target="_blank"
          rel="noopener"
        >
          View on GitHub
        </a>

      </article>

    </section>

  </main>


  <!-- FOOTER -->
  <footer>
    © 2026 Blue Whale Official
  </footer>


  <script>
    function closeSidebar() {
      document
        .getElementById("sidebar")
        .classList
        .add("closed");

      document.body.style.paddingLeft = "0";
    }
  </script>

</body>
</html>
