<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Blue Whale Official</title>

  <link rel="icon" href="favicon.ico">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #ffffff;
      color: #075bc9;
      font-family: "Comic Sans MS", "Comic Sans", cursive;
      display: flex;
      flex-direction: column;
      transition: padding-left 0.3s ease;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 250px;
      height: 100vh;

      background: #0877e8;
      border-right: 5px solid #075bc9;

      padding: 25px 18px;

      z-index: 1000;

      display: flex;
      flex-direction: column;

      transform: translateX(0);
      transition: transform 0.3s ease;

      box-shadow: 5px 0 0 #75b9ff;
    }

    .sidebar.closed {
      transform: translateX(-100%);
    }

    .sidebar-title {
      color: white;
      font-size: 27px;
      font-weight: bold;

      margin: 10px 10px 25px;

      transform: rotate(-2deg);
    }

    .sidebar a {
      color: white;
      text-decoration: none;

      font-size: 18px;
      font-weight: bold;

      padding: 13px 12px;
      margin: 4px 0;

      border: 3px solid transparent;
      border-radius: 8px 12px 7px 10px;

      transform: rotate(-1deg);

      transition:
        background 0.2s ease,
        transform 0.2s ease,
        border 0.2s ease;
    }

    .sidebar a:nth-child(even) {
      transform: rotate(1deg);
    }

    .sidebar a:hover {
      background: white;
      color: #0877e8;

      border: 3px solid #075bc9;

      transform: rotate(-2deg) scale(1.04);
    }

    .close-sidebar {
      position: absolute;

      top: 12px;
      right: 12px;

      width: 38px;
      height: 38px;

      border: 3px solid white;
      border-radius: 8px;

      background: #075bc9;
      color: white;

      font-size: 27px;
      font-weight: bold;

      cursor: pointer;

      transform: rotate(3deg);

      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }

    .close-sidebar:hover {
      background: white;
      color: #075bc9;
      transform: rotate(-5deg) scale(1.1);
    }

    /* =========================
       HEADER
    ========================= */

    header {
      height: 76px;

      display: flex;
      align-items: center;

      padding: 0 35px;

      border-bottom: 3px solid #0877e8;

      background: white;

      margin-left: 250px;

      transition: margin-left 0.3s ease;

      box-shadow: 0 3px 0 #75b9ff;
    }

    body.sidebar-closed header {
      margin-left: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;

      font-size: 21px;
      font-weight: bold;

      transform: rotate(-1deg);
    }

    .brand img {
      width: 48px;
      height: 48px;

      object-fit: contain;

      border: 3px solid #0877e8;
      border-radius: 50%;

      padding: 3px;

      animation: littleBob 2.5s ease-in-out infinite;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      flex: 1;

      margin-left: 250px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 50px 20px;

      transition: margin-left 0.3s ease;
    }

    body.sidebar-closed main {
      margin-left: 0;
    }

    .logo {
      width: min(430px, 75vw);
      height: auto;

      margin-bottom: 25px;

      animation:
        whaleFloat 3s ease-in-out infinite;

      filter:
        drop-shadow(5px 5px 0 #0877e8);
    }

    h1 {
      margin: 0 0 28px;

      font-size: clamp(32px, 6vw, 50px);

      text-align: center;

      color: #075bc9;

      transform: rotate(-1deg);

      text-shadow:
        2px 2px 0 #75b9ff;
    }

    /* =========================
       SEARCH BAR
    ========================= */

    .search {
      width: min(620px, 90vw);
      height: 58px;

      display: flex;
      align-items: center;

      padding: 5px 7px 5px 20px;

      background: white;

      border: 4px solid #0877e8;

      border-radius: 12px 25px 15px 20px;

      box-shadow:
        5px 5px 0 #0877e8,
        -2px 2px 0 #75b9ff;

      transform: rotate(-1deg);

      animation: searchWiggle 4s ease-in-out infinite;
    }

    .search input {
      flex: 1;

      min-width: 0;

      border: 0;
      outline: 0;

      background: transparent;

      font-family:
        "Comic Sans MS",
        "Comic Sans",
        cursive;

      font-size: 18px;

      color: #123;
    }

    .search input::placeholder {
      color: #8aa0b8;
    }

    .search button {
      width: 45px;
      height: 45px;

      border: 3px solid #075bc9;
      border-radius: 50%;

      background: #0877e8;
      color: white;

      font-family:
        "Comic Sans MS",
        "Comic Sans",
        cursive;

      font-size: 25px;
      font-weight: bold;

      cursor: pointer;

      transform: rotate(4deg);

      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }

    .search button:hover {
      background: #075bc9;
      transform: rotate(-6deg) scale(1.08);
    }

    /* =========================
       DOODLES
    ========================= */

    .doodle {
      position: fixed;

      color: #0877e8;

      font-size: 30px;

      pointer-events: none;

      opacity: 0.5;

      z-index: 0;
    }

    .doodle.one {
      top: 120px;
      right: 7%;

      transform: rotate(12deg);
    }

    .doodle.two {
      bottom: 120px;
      left: 8%;

      transform: rotate(-15deg);
    }

    .doodle.three {
      top: 45%;
      right: 4%;

      transform: rotate(-10deg);
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      margin-left: 250px;

      padding: 20px;

      text-align: center;

      color: #8aa0b8;

      font-size: 14px;

      border-top: 2px dashed #75b9ff;

      transition: margin-left 0.3s ease;
    }

    body.sidebar-closed footer {
      margin-left: 0;
    }

    /* =========================
       ANIMATIONS
    ========================= */

    @keyframes whaleFloat {
      0% {
        transform: translateY(0) rotate(-1deg);
      }

      50% {
        transform: translateY(-8px) rotate(1deg);
      }

      100% {
        transform: translateY(0) rotate(-1deg);
      }
    }

    @keyframes littleBob {
      0%,
      100% {
        transform: rotate(-3deg) translateY(0);
      }

      50% {
        transform: rotate(4deg) translateY(-4px);
      }
    }

    @keyframes searchWiggle {
      0%,
      100% {
        transform: rotate(-1deg);
      }

      50% {
        transform: rotate(1deg);
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      .sidebar {
        width: 220px;
      }

      header {
        margin-left: 0;
        padding: 0 18px;
      }

      main {
        margin-left: 0;
        padding: 35px 15px;
      }

      footer {
        margin-left: 0;
      }

      .brand {
        font-size: 18px;
      }

      .brand img {
        width: 42px;
        height: 42px;
      }

      .logo {
        width: min(350px, 85vw);
      }

      .search {
        width: 90vw;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       SIDEBAR
  ========================== -->

  <aside class="sidebar" id="sidebar">

    <button
      class="close-sidebar"
      onclick="closeSidebar()"
      aria-label="Close sidebar">
      ×
    </button>

    <div class="sidebar-title">
      Blue Whale
    </div>

    <a class="active" href="index.html">
      Include
    </a>

    <a href="members.html">
      Members
    </a>

    <a href="versions.html">
      Versions
    </a>

    <a href="other-projects.html">
      Other Projects
    </a>

    <a href="wasm-games.html">
      WASM Games
    </a>

    <a href="contact.html">
      Contact Me
    </a>

    <a
      href="https://www.youtube.com/@DUUUINGDUCK"
      target="_blank"
      rel="noopener">
      YT Channel
    </a>

  </aside>


  <!-- =========================
       HEADER
  ========================== -->

  <header>

    <div class="brand">

      <img
        src="blue-whale-logo.png"
        alt="Blue Whale">

      <span>
        Blue Whale Official
      </span>

    </div>

  </header>


  <!-- =========================
       DOODLES
  ========================== -->

  <div class="doodle one">
    ~~~
  </div>

  <div class="doodle two">
    ☆
  </div>

  <div class="doodle three">
    ~
  </div>


  <!-- =========================
       MAIN
  ========================== -->

  <main>

    <img
      class="logo"
      src="blue-whale-logo.png"
      alt="Blue Whale logo">

    <h1>
      Blue Whale Official
    </h1>

  <!-- =========================
       FOOTER
  ========================== -->

  <footer>
    © 2026 Blue Whale Official
  </footer>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script>

    function searchWeb(event) {

      event.preventDefault();

      const query =
        document
          .getElementById("searchInput")
          .value
          .trim();

      if (query) {

        window.location.href =
          "https://www.google.com/search?q=" +
          encodeURIComponent(query);

      }

    }


    function closeSidebar() {

      const sidebar =
        document.getElementById("sidebar");

      sidebar.classList.add("closed");

      document.body.classList.add(
        "sidebar-closed"
      );

    }

  </script>

</body>
</html>
